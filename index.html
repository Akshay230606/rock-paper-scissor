<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock,Paper,Scissor</title>
</head>

<body>

    <p>Open the console to see the game results !!!</p>

    <script>
        console.log("Hello World")
    </script>

    <script>
        let humanScore = 0;
        let computerScore = 0;

        function getComputerChoice() {
            const choices = ["rock", "paper", "scissors"];
            let index = Math.floor(Math.random() * 3);
            return choices[index];
        }

        function getHumanChoice() {
            let userChoice = prompt("rock,paper,scissor");
            return userChoice;


        }

        function playRound(humanChoice, computerChoice) {
            humanChoice = humanChoice.toLowerCase();
            if (humanChoice === computerChoice) {
                console.log("It's a tie!");
            } else {
                if (
                    (humanChoice === "rock" && computerChoice === "scissors") ||
                    (humanChoice === "paper" && computerChoice === "rock") ||
                    (humanChoice === "scissors" && computerChoice === "paper")
                ) {
                    console.log("You win this round!");
                    humanScore++;
                } else {
                    console.log("Computer wins this round!");
                    computerScore++;
                }
            }
        }

        function playGame() {
            for (let i = 1; i <= 5; i++) {
                const computerChoice = getComputerChoice();
                const humanChoice = getHumanChoice();
                playRound(humanChoice, computerChoice);
            }

            if (humanScore > computerScore) {
                console.log(`Human Wins!!!\n
                Human Score :${humanScore}\n
                Computer Score : ${computerScore}\n `);
            } else if (computerScore > humanScore) {
                console.log(`Computer Wins!!!\n
                Computer Score : ${computerScore}\n
                Human Score :${humanScore}\n `);
            } else {
                console.log(`Its a Tie!!!\n
                Computer Score : ${computerScore}\n
                Human Score :${humanScore}\n `);
            }
        }

        playGame();
    </script>
</body>

</html>
